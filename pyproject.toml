[project]
name = "currency-watcher"
version = "1.0.0"
description = "Monitor de tipos de cambio con notificaciones y alertas en Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.14.3",
    "plyer>=2.1.0",
    "ttkbootstrap>=2.2.2",
]

[project.scripts]
currency-watcher = "main:main"

[tool.setuptools]
py-modules = ["main", "ui", "rates", "alerts", "notifier", "config", "sounds"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
